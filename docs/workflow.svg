<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">SpecFlowLab public-beta workflow</title>
<desc id="desc">Raw CSV or UFS data flows through treatment and comparison into a provenance-preserving project, VIS/NIR merge, and OriginPro bridge.</desc>
<rect width="1200" height="300" rx="24" fill="#f7fafc"/>
<text x="60" y="52" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#18324b">SpecFlowLab reproducible workflow</text>
<g font-family="Arial, sans-serif" font-size="16" fill="#18324b">
<rect x="60" y="100" width="190" height="105" rx="16" fill="#dff4ff" stroke="#2f6fef" stroke-width="2"/>
<text x="155" y="138" text-anchor="middle" font-weight="700">Raw source</text>
<text x="155" y="166" text-anchor="middle">CSV / UFS</text>
<text x="155" y="190" text-anchor="middle">metadata retained</text>
<path d="M250 152 H300" stroke="#2f6fef" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="300" y="100" width="190" height="105" rx="16" fill="#e9f8ed" stroke="#1f883d" stroke-width="2"/>
<text x="395" y="138" text-anchor="middle" font-weight="700">Treat</text>
<text x="395" y="166" text-anchor="middle">baseline / chirp</text>
<text x="395" y="190" text-anchor="middle">explicit provenance</text>
<path d="M490 152 H540" stroke="#1f883d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="540" y="100" width="190" height="105" rx="16" fill="#fff4d6" stroke="#c57a00" stroke-width="2"/>
<text x="635" y="138" text-anchor="middle" font-weight="700">Inspect</text>
<text x="635" y="166" text-anchor="middle">heatmap / spectra</text>
<text x="635" y="190" text-anchor="middle">comparison / fit preview</text>
<path d="M730 152 H780" stroke="#c57a00" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="780" y="100" width="160" height="105" rx="16" fill="#f2eaff" stroke="#7b4bb7" stroke-width="2"/>
<text x="860" y="138" text-anchor="middle" font-weight="700">Merge</text>
<text x="860" y="166" text-anchor="middle">VIS + NIR</text>
<text x="860" y="190" text-anchor="middle">wavelength breaks</text>
<path d="M940 152 H990" stroke="#7b4bb7" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="990" y="100" width="150" height="105" rx="16" fill="#ffe6e6" stroke="#c43d3d" stroke-width="2"/>
<text x="1065" y="138" text-anchor="middle" font-weight="700">Share</text>
<text x="1065" y="166" text-anchor="middle">.sflproj</text>
<text x="1065" y="190" text-anchor="middle">OriginPro bridge</text>
</g>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#18324b"/></marker></defs>
</svg>
