name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript-and-origin:
    name: JavaScript, build, and Origin bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm test
      - run: npm run test:origin
      - run: npm run build

  rust:
    name: Rust native-shell tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  build-windows:
    name: Package Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri for Windows (.msi + .exe)
        run: npx tauri build --ci

      - name: Package portable Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path releases
          $Version = (Get-Content package.json | ConvertFrom-Json).version
          $PortableExe = "releases/SpecFlowLab-$Version-Windows-x64-portable.exe"
          $PortableZip = "releases/SpecFlowLab-$Version-Windows-x64-portable.zip"
          Copy-Item src-tauri/target/release/specflowlab.exe $PortableExe
          Compress-Archive -Path $PortableExe -DestinationPath $PortableZip
          $Hash = (Get-FileHash -Algorithm SHA256 $PortableZip).Hash.ToLower()
          "$Hash  $(Split-Path $PortableZip -Leaf)" | Set-Content -Encoding ascii "$PortableZip.sha256"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SpecFlowLab-Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            releases/SpecFlowLab-1.0.8-Windows-x64-portable.exe
            releases/SpecFlowLab-1.0.8-Windows-x64-portable.zip
            releases/SpecFlowLab-1.0.8-Windows-x64-portable.zip.sha256
          retention-days: 30

  build-macos:
    name: Package macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build ad-hoc-signed macOS application
        run: npx tauri build --ci --bundles app

      - name: Package portable application, disk image, and checksums
        run: |
          mkdir -p releases
          ARCH="$(uname -m)"
          ARCHIVE="releases/SpecFlowLab-1.0.8-macOS-${ARCH}-portable.zip"
          DISK_IMAGE="releases/SpecFlowLab-1.0.8-macOS-${ARCH}.dmg"
          DMG_STAGE="$(mktemp -d)"
          ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/SpecFlowLab.app" "$ARCHIVE"
          ditto "src-tauri/target/release/bundle/macos/SpecFlowLab.app" "$DMG_STAGE/SpecFlowLab.app"
          ln -s /Applications "$DMG_STAGE/Applications"
          hdiutil create -volname SpecFlowLab -srcfolder "$DMG_STAGE" -ov -format UDZO "$DISK_IMAGE"
          ARCHIVE_HASH="$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')"
          DISK_IMAGE_HASH="$(shasum -a 256 "$DISK_IMAGE" | awk '{print $1}')"
          printf '%s  %s\n' "$ARCHIVE_HASH" "$(basename "$ARCHIVE")" > "$ARCHIVE.sha256"
          printf '%s  %s\n' "$DISK_IMAGE_HASH" "$(basename "$DISK_IMAGE")" > "$DISK_IMAGE.sha256"

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: SpecFlowLab-macOS
          path: |
            releases/SpecFlowLab-1.0.8-macOS-*-portable.zip*
            releases/SpecFlowLab-1.0.8-macOS-*.dmg*
          retention-days: 30
