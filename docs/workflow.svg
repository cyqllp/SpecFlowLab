<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="450" viewBox="0 0 1280 450" role="img" aria-labelledby="title desc">
  <title id="title">SpecFlowLab workflow</title>
  <desc id="desc">Transient spectroscopy data moves from import through preparation, exploration, global fitting, signature review, and project export. External spectroscopy, figures, and papers enter an evidence library and connect to signature review.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#35506b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#18324b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1280" height="450" rx="24" fill="#f7fafc"/>
  <text x="40" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#18324b">From measurement to reviewable evidence</text>
  <text x="40" y="76" font-family="Arial, sans-serif" font-size="15" fill="#587086">Raw data stays linked to every processing and interpretation step.</text>

  <g font-family="Arial, sans-serif" fill="#18324b" filter="url(#shadow)">
    <rect x="40" y="112" width="175" height="132" rx="16" fill="#dff4ff" stroke="#2f6fef" stroke-width="2"/>
    <rect x="245" y="112" width="175" height="132" rx="16" fill="#e9f8ed" stroke="#1f883d" stroke-width="2"/>
    <rect x="450" y="112" width="175" height="132" rx="16" fill="#fff4d6" stroke="#c57a00" stroke-width="2"/>
    <rect x="655" y="112" width="175" height="132" rx="16" fill="#f2eaff" stroke="#7b4bb7" stroke-width="2"/>
    <rect x="860" y="112" width="175" height="132" rx="16" fill="#ffe9f0" stroke="#b53a68" stroke-width="2"/>
    <rect x="1065" y="112" width="175" height="132" rx="16" fill="#e8eef5" stroke="#526d82" stroke-width="2"/>
  </g>

  <g font-family="Arial, sans-serif" fill="#18324b" text-anchor="middle">
    <text x="127.5" y="148" font-size="17" font-weight="700">Import data</text>
    <text x="127.5" y="177" font-size="14">CSV or UFS</text>
    <text x="127.5" y="201" font-size="14">folders and details</text>

    <text x="332.5" y="148" font-size="17" font-weight="700">Prepare</text>
    <text x="332.5" y="177" font-size="14">range and baseline</text>
    <text x="332.5" y="201" font-size="14">chirp when needed</text>

    <text x="537.5" y="148" font-size="17" font-weight="700">Explore</text>
    <text x="537.5" y="177" font-size="14">heatmap and slices</text>
    <text x="537.5" y="201" font-size="14">compare or merge</text>

    <text x="742.5" y="148" font-size="17" font-weight="700">Global fit</text>
    <text x="742.5" y="177" font-size="14">summary and residual</text>
    <text x="742.5" y="201" font-size="14">EAS and DAS</text>

    <text x="947.5" y="148" font-size="17" font-weight="700">Review signatures</text>
    <text x="947.5" y="177" font-size="14">suggested peaks</text>
    <text x="947.5" y="201" font-size="14">edit labels on plot</text>

    <text x="1152.5" y="148" font-size="17" font-weight="700">Save and share</text>
    <text x="1152.5" y="177" font-size="14">project and plots</text>
    <text x="1152.5" y="201" font-size="14">AI or Origin export</text>
  </g>

  <g fill="none" stroke="#35506b" stroke-width="3" marker-end="url(#arrow)">
    <path d="M215 178 H241"/>
    <path d="M420 178 H446"/>
    <path d="M625 178 H651"/>
    <path d="M830 178 H856"/>
    <path d="M1035 178 H1061"/>
  </g>

  <g font-family="Arial, sans-serif" fill="#18324b" filter="url(#shadow)">
    <rect x="450" y="318" width="250" height="92" rx="16" fill="#e6f7f4" stroke="#238878" stroke-width="2"/>
    <rect x="750" y="318" width="250" height="92" rx="16" fill="#eef2ff" stroke="#5769b3" stroke-width="2"/>
  </g>

  <g font-family="Arial, sans-serif" fill="#18324b" text-anchor="middle">
    <text x="575" y="352" font-size="17" font-weight="700">Import related evidence</text>
    <text x="575" y="379" font-size="14">Abs, PL, figures, papers, files</text>

    <text x="875" y="352" font-size="17" font-weight="700">Connect the evidence</text>
    <text x="875" y="379" font-size="14">selected links and relation map</text>
  </g>

  <g fill="none" stroke="#35506b" stroke-width="3" marker-end="url(#arrow)">
    <path d="M700 364 H746"/>
    <path d="M947 318 V250"/>
  </g>

  <text x="40" y="426" font-family="Arial, sans-serif" font-size="13" fill="#6a7f91">Suggested labels remain user-reviewed interpretations; they do not change the fitted data.</text>
</svg>
