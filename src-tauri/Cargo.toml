[package]
name = "specflowlab"
version = "1.0.0"
description = "SpecFlowLab time-resolved spectroscopy workspace"
authors = ["SpecFlowLab"]
edition = "2021"

[lib]
name = "specflowlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
