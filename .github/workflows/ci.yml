name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript-and-origin:
    name: JavaScript, build, and Origin bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm test
      - run: npm run test:origin
      - run: npm run build

  rust:
    name: Rust native-shell tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  build-windows:
    name: Package Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri for Windows (.msi + .exe)
        run: npx tauri build --ci

      - name: Copy portable exe to releases
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path releases
          Copy-Item src-tauri/target/release/specflowlab.exe releases/SpecFlowLab-portable.exe

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SpecFlowLab-Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            releases/SpecFlowLab-portable.exe
          retention-days: 30

  build-macos:
    name: Package macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build ad-hoc-signed macOS application
        run: npx tauri build --ci --bundles app

      - name: Package portable application and checksum
        run: |
          mkdir -p releases
          ARCH="$(uname -m)"
          ARCHIVE="releases/SpecFlowLab-1.0.7-macOS-${ARCH}-portable.zip"
          ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/SpecFlowLab.app" "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: SpecFlowLab-macOS
          path: releases/SpecFlowLab-1.0.7-macOS-*-portable.zip*
          retention-days: 30
